<script>
    const correo = localStorage.getItem("correo");

    // 🔒 validar sesión
    if (!correo) {
        window.location.href = "login.html";
    }

    // 🚪 logout
    function logout() {
        localStorage.clear();
        window.location.href = "login.html";
    }

    // 📥 cargar citas
    async function cargarCitas() {
        try {
            const res = await fetch("http://localhost:3000/mis-citas/" + correo);
            const citas = await res.json();

            const tabla = document.getElementById("tabla-citas-body");

            if (citas.length === 0) {
                tabla.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-muted py-4">No tienes citas registradas</td>
                    </tr>
                `;
                return;
            }

            tabla.innerHTML = "";

            citas.forEach(cita => {
                tabla.innerHTML += `
                    <tr>
                        <td>${cita.especialidad}</td>
                        <td>${cita.fecha}</td>
                        <td>${cita.hora}</td>
                        <td><span class="badge bg-success">${cita.estado}</span></td>
                        <td>
                            <button class="btn btn-danger btn-sm" onclick="eliminarCita(${cita.id})">
                                Cancelar
                            </button>
                        </td>
                    </tr>
                `;
            });

        } catch (error) {
            console.error(error);
            alert("Error al cargar citas");
        }
    }

    // ❌ eliminar cita
    async function eliminarCita(id) {
        if (!confirm("¿Cancelar esta cita?")) return;

        await fetch("http://localhost:3000/citas/" + id, {
            method: "DELETE"
        });

        cargarCitas();
    }

    // 🚀 iniciar
    cargarCitas();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
