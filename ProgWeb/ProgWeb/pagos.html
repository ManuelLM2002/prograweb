<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos - Clínica San Rafael</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="inicio.html">Clínica San Rafael</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="inicio.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="panel.html">Agendar Cita</a></li>
                    <li class="nav-item"><a class="nav-link" href="citas.html">Mis Citas</a></li>
                    <li class="nav-item"><a class="nav-link active" href="pagos.html">Pagos</a></li>
                    <li class="nav-item"><a class="nav-link" href="galeria.html">Galería</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="login.html">Cerrar Sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <div class="card shadow border-0 rounded-4">
                    <div class="card-header bg-primary text-white text-center py-3 rounded-top-4">
                        <h4 class="mb-0 fw-bold">Pago de Consulta</h4>
                    </div>
                    
                    <div class="card-body p-4 p-md-5">
                        <div class="alert alert-info text-center mb-4 shadow-sm">
                            Total a pagar: <strong class="fs-4 d-block mt-1">$500.00 MXN</strong>
                        </div>

                        <form id="form-pago">
                            <div class="mb-3">
                                <label class="form-label text-muted small text-uppercase fw-bold">Nombre en la tarjeta</label>
                                <input type="text" class="form-control form-control-lg bg-light" placeholder="Ej. Manuel de Jesús" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted small text-uppercase fw-bold">Número de tarjeta</label>
                                <input type="text" class="form-control form-control-lg bg-light" placeholder="0000 0000 0000 0000" maxlength="19" required>
                            </div>

                            <div class="row">
                                <div class="col-6 mb-4">
                                    <label class="form-label text-muted small text-uppercase fw-bold">Vencimiento</label>
                                    <input type="text" class="form-control form-control-lg bg-light" placeholder="MM/AA" maxlength="5" required>
                                </div>
                                <div class="col-6 mb-4">
                                    <label class="form-label text-muted small text-uppercase fw-bold">CVV</label>
                                    <input type="password" class="form-control form-control-lg bg-light" placeholder="123" maxlength="4" required>
                                </div>
                            </div>

                            <button type="submit" id="btn-pagar" class="btn btn-success btn-lg w-100 shadow fw-bold">
                                Confirmar Pago
                            </button>
                        </form>
                    </div>
                </div>

                <div class="text-center mt-4 text-muted small">
                    <p>🔒 Pago 100% seguro y encriptado.</p>
                </div>

            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p class="mb-0">© 2026 - Clínica San Rafael - Proyecto HTML5 & Bootstrap</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
