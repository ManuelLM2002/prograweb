<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Clínica San Rafael</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container justify-content-center">
            <span class="navbar-brand fw-bold fs-3">Clínica San Rafael</span>
        </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">

        <div class="card shadow-lg border-0 rounded-4" style="width: 100%; max-width: 450px;">
            <div class="card-body p-5">
                
                <h3 class="text-center mb-4 fw-bold text-primary">Iniciar Sesión</h3>

                <form action="inicio.html">
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Correo Electrónico</label>
                        <input type="email" class="form-control form-control-lg bg-light" placeholder="usuario@correo.com" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold">Contraseña</label>
                        <input type="password" class="form-control form-control-lg bg-light" placeholder="••••••••" required>
                    </div>

                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">Entrar</button>
                    </div>

                    <p class="mt-3 text-center text-muted small">
                        Al iniciar sesión aceptas nuestras <a href="#" class="text-decoration-none">Condiciones de uso</a>
                    </p>

                    <hr>

                    <p class="text-center mb-0 text-muted">
                        ¿No tienes una cuenta? <a href="registro.html" class="fw-bold text-decoration-none">Regístrate aquí</a>
                    </p>
                </form>

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
